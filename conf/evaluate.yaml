defaults:
  - crop: ???     # The crop to evaluate
  - override hydra/job_logging: custom
  - _self_

folder: ???       # A training run folder, or any folder containing training runs
split: test       # train, valid or test
data_root: null   # null = use the data_root the model was trained with
device: cuda      # cuda, cuda:<n> for a specific GPU, or cpu
num_workers: 4    # Number of processes for parallel loading of examples


hydra:
  run:
    dir: ${folder}/eval/${crop.name}-${split}
  sweep:
    dir: ${folder}/eval
    subdir: ${crop.name}-${split}