# Probably no reason to touch this if you're poking around in here

defaults:
  - crop: ???
  - _self_

checkpoint: ???   # Training run folder, has .hydra/ and <model>-best.pt
split: valid      # Which split is being scored
data_root: null   # null = use data_root from the model's cfg (which data_root the model was trained with)
device: cuda      # cuda, cuda:<n> for a specific GPU, or cpu
num_workers: 4    # Number of processes for parallel loading of examples

hydra:
  run:
    dir: ${checkpoint}/eval/${crop.name}-${split}
  output_subdir: .hydra-check_sizing
  job_logging:
    handlers:
      file:
        mode: w   # Overwrite the log on each run instead of appending