defaults:
  - crop: ???           # '???' here means it MUST be supplied by the user in the command line
  - model: deeplabv3
  - loss: ce    
  - sizing: native      # How should images be sized before being fed to the model
  - override hydra/job_logging: custom
  - _self_

data_root: ???          # Root dataset directory
optimizer: rmsprop      # Which optimizer to use
epochs: 100             # Maximum number of epochs to train for
monitor: valid_loss     # What metric to measure for early stopping of training
patience: 7             # How many epochs to continue training for without improvement in the monitored metric
batch_size: 8           # Number of images in each training batch
lr: 1e-4                # Learning rate for the current training session
output_dir: checkpoints # Where train.py should output to
seed: 42                # Random seed for the training process
eval_splits: [test]     # The splits to score with the best model - [] for none
device: cuda            # cuda, cuda:<n> for a specific GPU, or cpu
num_workers: 4          # Number of processes for parallel loading of examples
resume: false           # True = carry on from the last finished epoch in the run folder given by hydra.run.dir (or hydra.sweep.dir for a sweep)


# Determines where the outputs go - ${var} references variables from the hydra config
hydra:
  job_logging:
    handlers:
      file:
        mode: a     # Append so a resumed run keeps the log from before it stopped
  run:
    dir: ${output_dir}/${model.name}/${crop.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${output_dir}/sweeps/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${model.name}/${crop.name}/${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys: [data_root, crop, output_dir, device, num_workers, eval_splits, resume]  # Any key that isn't an experimental setting (where things get put, which device, how fast data loads, etc)
        kv_sep: "-"
        item_sep: "+"
