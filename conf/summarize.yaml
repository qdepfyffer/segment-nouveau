folder: ???     # The sweep folder that should be searched
metrics: [accuracy, precision, recall, fpr, f1, sunlit_iou, non_sunlit_iou, mean_iou] # Keys from "scores" in metrics.json

hydra:
  run:
    dir: ${folder}/summary/

  job_logging:
    handlers:
      file:
        mode: w   # Overwrite the log on each run instead of appending